[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmtrace"
version = "0.1.0"
description = "Simulation study: can a tool-call log separate a credential relay from benign teamwork?"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [{name = "Patrick Schmitt"}]
dependencies = ["numpy", "pandas", "scikit-learn"]

[project.urls]
Repository = "https://github.com/patschmittdev/swarm-detect"
Issues = "https://github.com/patschmittdev/swarm-detect/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff", "jsonschema"]

[project.scripts]
swarmtrace = "swarmtrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"swarmtrace.trace" = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
