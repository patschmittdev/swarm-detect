  <title id="title">By-run test AUROC by visibility tier</title>
  <desc id="description">volume (family-independent) at V0 generic has AUROC 0.525, with interval from 0.413 to 0.648 (bootstrap bounds). logistic at V0 generic has AUROC 0.440, with interval from 0.308 to 0.550 (bootstrap bounds). boosted at V0 generic has AUROC 0.418, with interval from 0.303 to 0.529 (bootstrap bounds). volume (family-independent) at V1 aggregation has AUROC 0.525, with interval from 0.413 to 0.648 (bootstrap bounds). rule at V1 aggregation has AUROC 0.909, with interval from 0.851 to 0.959 (bootstrap bounds). logistic at V1 aggregation has AUROC 0.920, with interval from 0.873 to 0.961 (bootstrap bounds). boosted at V1 aggregation has AUROC 0.926, with interval from 0.877 to 0.967 (bootstrap bounds). volume (family-independent) at V2 all has AUROC 0.525, with interval from 0.413 to 0.648 (bootstrap bounds). rule at V2 all has AUROC 0.909, with interval from 0.851 to 0.959 (bootstrap bounds). logistic at V2 all has AUROC 0.913, with interval from 0.860 to 0.955 (bootstrap bounds). boosted at V2 all has AUROC 0.903, with interval from 0.848 to 0.953 (bootstrap bounds). V0 generic rule is n/a: not available at this tier; its n/a label is below the axis. The dashed horizontal line is chance AUROC 0.5 (unitless).</desc>
