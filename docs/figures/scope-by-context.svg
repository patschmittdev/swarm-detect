    <circle cx="318" cy="182.638" r="5.500" fill="#fafbf9" stroke="#315c7b" stroke-width="1.800" />
    <line x1="318" y1="197.637" x2="318" y2="167.919" stroke="#315c7b" stroke-width="1.800" />
    <line x1="314" y1="197.637" x2="322" y2="197.637" stroke="#315c7b" stroke-width="1.800" />
    <line x1="314" y1="167.919" x2="322" y2="167.919" stroke="#315c7b" stroke-width="1.800" />
  </g>
  <text x="318" y="393" text-anchor="middle" font-size="12">C0: files_rule</text>
