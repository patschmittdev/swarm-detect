    <line x1="474" y1="181.795" x2="482" y2="181.795" stroke="#315c7b" stroke-width="1.800" />
    <line x1="474" y1="157.295" x2="482" y2="157.295" stroke="#315c7b" stroke-width="1.800" />
  </g>
  <text x="478" y="393" text-anchor="middle" font-size="12">C0: scope_rule</text>
  <g data-series="Strict" data-label="C2: scope_rule" data-value="0.9661" data-lo="0.9377" data-hi="0.9867">
    <circle cx="638" cy="139.933" r="5.500" fill="#fafbf9" stroke="#315c7b" stroke-width="1.800" />
    <line x1="638" y1="146.578" x2="638" y2="135.112" stroke="#315c7b" stroke-width="1.800" />
    <line x1="634" y1="146.578" x2="642" y2="146.578" stroke="#315c7b" stroke-width="1.800" />
    <line x1="634" y1="135.112" x2="642" y2="135.112" stroke="#315c7b" stroke-width="1.800" />
  </g>
  <text x="638" y="393" text-anchor="middle" font-size="12">C2: scope_rule</text>
</svg>
