<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" width="720" height="466" font-family="sans-serif" font-size="13" fill="#25313d" role="img" aria-labelledby="title description">
  <title id="title">By-run test AUROC by benign sharing rate</title>
  <desc id="description">q = realised fraction of test controls with a sharing team; by-run test split; V1 aggregation; y axis 0.5 to 1.0. rule at 0 has AUROC 1.000, with interval from 1.000 to 1.000 (bootstrap bounds). rule at 5 has AUROC 0.932, with interval from 0.912 to 0.953 (bootstrap bounds). rule at 10 has AUROC 0.907, with interval from 0.882 to 0.931 (bootstrap bounds). rule at 30 has AUROC 0.762, with interval from 0.721 to 0.807 (bootstrap bounds). logistic at 0 has AUROC 1.000, with interval from 1.000 to 1.000 (bootstrap bounds). logistic at 5 has AUROC 0.936, with interval from 0.914 to 0.958 (bootstrap bounds). logistic at 10 has AUROC 0.913, with interval from 0.886 to 0.937 (bootstrap bounds). logistic at 30 has AUROC 0.794, with interval from 0.750 to 0.839 (bootstrap bounds). expected 1 - q/2 at rate 0 percent is 1.0000 (theoretical reference, without an uncertainty interval). expected 1 - q/2 at rate 5 percent is 0.9414 (theoretical reference, without an uncertainty interval). expected 1 - q/2 at rate 10 percent is 0.8971 (theoretical reference, without an uncertainty interval). expected 1 - q/2 at rate 30 percent is 0.7479 (theoretical reference, without an uncertainty interval). Within each rate, rule is left, logistic is centre and the expected reference is right; adjacent series are offset horizontally by 12 pixels.</desc>
  <rect x="0" y="0" width="720" height="466" fill="#fafbf9" />
  <text x="28" y="34" font-size="22" font-weight="bold">By-run test AUROC by benign sharing rate</text>
  <text x="28" y="58" font-size="12">q = realised fraction of test controls with a sharing team; by-run test split; V1 aggregation</text>
  <text x="28" y="77" font-size="12">y axis 0.5 to 1.0</text>
